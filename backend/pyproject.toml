[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-007-theo-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "agentstepkit @ git+https://github.com/B-Tree-Consulting/b-tree-aydeo-bfa.git@v0.2.27",
  "aydeo-audit-sdk @ git+https://github.com/B-Tree-Consulting/b-tree-aydeo-audit.git@0.1.2#subdirectory=packages/aydeo_audit_sdk",
  "aydeo-cms-client @ git+https://github.com/B-Tree-Consulting/b-tree-aydeo_be.git@main#subdirectory=packages/aydeo_cms_client",
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.1,<4",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "PyJWT>=2.8,<3",
  "cryptography>=42,<46",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov>=5,<7",
  "httpx>=0.27,<1",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "case_identity: override the test-only case identity overlay (production=True = no overlay / live-facts mock)",
    "no_host_canaries: do not register test-only canary tools on HostSampleBFA",
]

[tool.coverage.run]
source = ["src"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
