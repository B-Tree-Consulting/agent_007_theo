services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GH_TOKEN: ${GITHUB_TOKEN:-}
        AGENTSTEPKIT_REF: v0.2.27
        AYDEO_AUDIT_SDK_REF: "0.1.2"
        AYDEO_CMS_CLIENT_REF: main
        AYDEO_CMS_CLIENT_VERSION: "0.3.0"
    working_dir: /app/backend
    ports:
      # Published on the host at 8015. The process inside the container listens on 8000.
      - "8015:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./scripts:/app/scripts
      # Repo-root compose for bootstrap-strip pytest (expects /app/docker-compose.yml).
      - ./docker-compose.yml:/app/docker-compose.yml:ro
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --log-level ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent-007-theo}
      POSTGRES_USER: ${POSTGRES_USER:-agent-007-theo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - agent_007_theo_postgres_data:/var/lib/postgresql/data
    ports:
      # Host port 5437. 5432–5436 are used by other local Postgres processes.
      - "5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent-007-theo}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  agent_007_theo_postgres_data:
